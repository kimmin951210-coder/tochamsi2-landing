<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>토참시 생방송 안내</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 891px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .wrapper {
        width: 45%;
        max-width: 720px;
      }
    }

    .wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 클릭 영역 공통 */
    .click-zone {
      position: absolute;
      left: 10.4%;
      width: 77.5%;

      display: block;
      cursor: pointer;
      z-index: 10;
    }

    /* 1. 지금 생방송 보기 */
    .zone1 {
      top: 51.4%;
      height: 8.6%;
    }

    /* 2. 지난 방송 다시보기 */
    .zone2 {
      top: 61%;
      height: 8.6%;
    }

    /* 3. 오늘의 방송 일정 */
    .zone3 {
      top: 71%;
      height: 8.6%;
    }

    /* 4. 커뮤니티 문의 */
    .zone4 {
      top: 80.7%;
      height: 8.6%;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- 랜딩 이미지 -->
    <img
      src="./landing.png"
      alt="토참시 생방송 안내 페이지"
    />

    <!-- 1. 지금 생방송 보기 -->
    <a
      class="click-zone zone1"
      href="https://xn--or3b21d71b.tv/%ED%86%A0%EC%B0%B8%EC%8B%9C"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="지금 생방송 보기">
    </a>

    <!-- 2. 지난 방송 다시보기 -->
    <a
      class="click-zone zone2"
      href="https://www.youtube.com/@ToToCeo6974/featured"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="지난 방송 다시보기">
    </a>

    <!-- 3. 오늘의 방송 일정 -->
    <a
      class="click-zone zone3"
      href="https://open.kakao.com/o/sZPGH9Dg"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="오늘의 방송 일정">
    </a>

    <!-- 4. 커뮤니티 문의 -->
    <a
      class="click-zone zone4"
      href="https://telegram.me/storyinquiry"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="커뮤니티 문의">
    </a>

  </div>

</body>
</html>
