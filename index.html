  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-DLTQB1BX1N');

    function trackClick(eventName, buttonName, linkUrl) {
      gtag('event', eventName, {
        event_category: 'landing_button',

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 891px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .wrapper {
        width: 45%;
        max-width: 720px;
      }
    }

    .wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    .click-zone {
      position: absolute;
      left: 10.4%;
      width: 77.5%;
      display: block;
      cursor: pointer;
      z-index: 10;
    }

    .zone1 {
      top: 51.4%;
      height: 8.6%;
    }

    .zone2 {
      top: 61%;
      height: 8.6%;
    }

    .zone3 {
      top: 71%;
      height: 8.6%;

</head>

<body>
